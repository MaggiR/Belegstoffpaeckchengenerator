server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Variable proxy_pass braucht einen Resolver, auch für IP-Adressen.
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=10s;

    client_max_body_size 128m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ollama/ {
        # Ohne Header bleibt $proxy_pass leer → nginx 502 nur für /ollama, nicht für die App.
        set $ollama_upstream $http_x_ollama_upstream;
        rewrite ^/ollama/(.*)$ /$1 break;
        proxy_pass $ollama_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_connect_timeout 5s;
        # Wir fragen Ollama mit `stream: false` ab: bis zum Ende der Generierung
        # fließt kein Byte, deshalb muss die Lesepause die volle Rechenzeit
        # inklusive Modell-Ladezeit abdecken.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 128m;
        client_body_buffer_size 16m;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        # So schlank wie ein curl-Aufruf: Auth-Proxies vor Ollama werten Origin,
        # Cookies oder Client-IPs aus und lehnen sonst trotz gültigem Bearer ab.
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Ollama-Upstream "";
        proxy_intercept_errors off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }
}
